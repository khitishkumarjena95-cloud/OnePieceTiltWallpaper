name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'OnePieceTiltWallpaper_Project_With_Your_Images.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project archive
        run: |
          test -f OnePieceTiltWallpaper_Project_With_Your_Images.zip || { echo "Upload OnePieceTiltWallpaper_Project_With_Your_Images.zip to the repository root first."; exit 1; }
      - name: Extract Android project
        run: unzip -o OnePieceTiltWallpaper_Project_With_Your_Images.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OnePieceTiltWallpaper-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
